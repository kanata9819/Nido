[workspace]
members = ["crates/nido", "crates/nido-core", "crates/nido-backend"]
default-members = ["crates/nido"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "A keyboard-first Neovim desktop client"
license = "MIT"
repository = "https://github.com/kanata9819/Nido"

[workspace.dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest", "font-kit", "x11", "wayland"] }
async-channel = "=2.5.0"
unicode-segmentation = "1.13.3"
fontdb = "0.23"
ignore = "0.4"
notify = "8"
pulldown-cmark = "0.13"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.17"
rmpv = { version = "1", features = ["with-serde"] }
rusty-leveldb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
trash = "5"
uuid = { version = "1", features = ["v4"] }
nido-core = { path = "crates/nido-core" }
nido-backend = { path = "crates/nido-backend" }
winresource = "0.1.31"

[profile.release]
lto = "thin"
strip = true
