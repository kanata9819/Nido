[package]
name = "nido"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "A keyboard-first Neovim desktop client"
license = "MIT"
repository = "https://github.com/kanata9819/Nido"

[dependencies]
anyhow = "1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
fontdb = "0.23"
ignore = "0.4"
notify = "8"
pulldown-cmark = "0.13"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.17"
rmpv = { version = "1", features = ["with-serde"] }
rusty-leveldb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
trash = "5"
uuid = { version = "1", features = ["v4"] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "nido"
path = "src/main.rs"
