name: Release Windows

on:
    push:
        tags: ['v*']

permissions:
    contents: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 12.5.1
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - name: Verify release version
              shell: pwsh
              run: |
                  $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
                  if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
            - run: pnpm install --frozen-lockfile
            - run: rustup component add rust-analyzer rust-src rustfmt
            - run: pnpm lint --max-warnings 0
            - run: pnpm typecheck:windows
            - run: pnpm build
            - run: pnpm test
            - run: pnpm test:prefetch
            - name: Verify the packaged Windows app before publishing
              run: |
                  pnpm exec electron-builder --win --dir --publish never
                  if ($LASTEXITCODE -ne 0) { throw 'Unable to package the Windows app.' }
                  pnpm test:windows
                  if ($LASTEXITCODE -ne 0) { throw 'Windows baseline failed.' }
            - name: Verify installer file transfer
              run: pnpm test:installer
            - name: Verify packaged update download, cancellation and save
              run: pnpm verify:update
            - name: Prepare a single draft release
              shell: pwsh
              run: |
                  # Create the release before parallel artifact uploads can race to create it.
                  gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
                  if ($LASTEXITCODE -ne 0) {
                      gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "Nido $env:GITHUB_REF_NAME" --generate-notes
                      if ($LASTEXITCODE -ne 0) { throw 'Unable to prepare the draft release.' }
                  }
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Upload Windows test reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: windows-release-test-reports
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
            - name: Publish installer and update metadata
              run: pnpm exec electron-builder --win --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Verify assets and publish release
              shell: pwsh
              run: |
                  $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
                  $releaseJson = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets
                  if ($LASTEXITCODE -ne 0) { throw 'Unable to verify release assets.' }
                  $release = $releaseJson | ConvertFrom-Json
                  foreach ($name in @("nido-$version-setup.exe", "nido-$version-setup.exe.blockmap", 'latest.yml')) {
                      $asset = @($release.assets | Where-Object { $_.name -eq $name })
                      if ($asset.Count -ne 1 -or $asset[0].size -le 0) { throw "Missing release asset: $name" }
                  }
                  gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest
                  if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the complete release.' }
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
