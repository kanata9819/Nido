name: Windows native

on:
  pull_request:
  push:
    branches: [main, replace-to-rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: resources/languages/package-lock.json
      - name: Prepare Rust checks
        run: rustup component add rustfmt clippy rust-analyzer rust-src
      - name: Prepare bundled editor, language servers and debugger
        run: ./scripts/prepare-runtime.ps1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Rust without warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test parsers and data protection
        run: cargo test --locked
      - name: Test Neovim integration and native UI state
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          cargo run --locked -- --smoke-test 2>&1 | Tee-Object reports/native-smoke.txt
          if ($LASTEXITCODE -ne 0) { throw 'Native smoke tests failed.' }
      - name: Install NSIS
        run: choco install nsis --no-progress --yes
      - name: Build native Windows release assets
        run: ./scripts/package-windows.ps1
      - name: Verify installed package with isolated data
        run: |
          ./scripts/test-package.ps1 2>&1 | Tee-Object reports/native-package.txt
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native smoke tests failed.' }
      - name: Record the verified source revision
        run: |
          git rev-parse HEAD | Set-Content reports/source-sha.txt
          Copy-Item reports/source-sha.txt dist/release/source-sha.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-baseline-reports
          path: reports/native-*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release-assets
          path: dist/release/*
          if-no-files-found: error
