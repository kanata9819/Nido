name: Windows baseline

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: windows-baseline-${{ github.ref }}
    cancel-in-progress: true

jobs:
    windows:
        runs-on: windows-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 12.5.1
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Prepare Rust language and debugging tests
              run: rustup component add rust-analyzer rust-src rustfmt
            - name: Verify the packaged Windows app
              run: pnpm verify:windows
            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: windows-baseline-reports
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7
